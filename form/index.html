                </div>

                <h1 class="form__text_title">
                    با ما همراه شوید؛ درخشش در مدیریت
                </h1>

                <p class="form__text_2">
                    از همین حالا به راحتی افراد را مدیریت کنید
                </p>

            </header>

            <!-- Form -->

            <form action="#" method="post" class="form">

                <!-- Full Name -->

                <div class="form__group">

                    <label for="name" class="inputName">
                        نام و نام خانوادگی
                        <span>*</span>
                    </label>

                    <input
                        class="input_form"
                        id="name"
                        type="text"
                        name="name"
                        placeholder="نام و نام خانوادگی"
                        autocomplete="name"
                        required
                    >

                </div>

                <!-- Email -->

                <div class="form__group">

                    <label for="email" class="inputName">
                        ایمیل
                        <span>*</span>
                    </label>

                    <input
                        class="input_form"
                        id="email"
                        type="email"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        dir="ltr"
                        required
                    >

                </div>

                <!-- Password -->

                <div class="form__group">

                    <label for="password" class="inputName">
                        رمز عبور
                        <span>*</span>
                    </label>

                    <div class="password__wrapper">

                        <input
                            class="input_form"
                            id="password"
                            type="password"
                            name="password"
                            placeholder="حداقل ۸ کاراکتر"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <label
                            for="showPassword"
                            class="password__toggle"
                            aria-label="نمایش رمز عبور"
                        >

                            <input
                                type="checkbox"
                                id="showPassword"
                                class="password__checkbox"
                            >

                            <svg class="eye__open"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>

                            </svg>

                            <svg class="eye__closed"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <path d="m3 3 18 18"/>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                                <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3-.5"/>

                            </svg>

                        </label>

                    </div>

                </div>

                <!-- Submit -->

                <button type="submit" class="submit__form_btn">

                    <span>ساخت حساب کاربری</span>

                    <span class="btn__arrow">←</span>

                </button>

            </form>

            <!-- Divider -->

            <div class="form__divider">
                <span>یا ادامه دهید با</span>
            </div>

            <!-- Social Login -->

            <div class="social__buttons">

                <button type="button" class="social__btn">

                    <svg viewBox="0 0 24 24" width="21" height="21">
                        <path fill="#1877F2" d="M24 12a12 12 0 1 0-13.875 11.85v-8.38H7.08V12h3.045V9.35c0-3.005 1.79-4.665 4.53-4.665 1.31 0 2.68.235 2.68.235v2.95h-1.51c-1.49 0-1.955.925-1.955 1.875V12h3.325l-.53 3.47h-2.795v8.38A12.002 12.002 0 0 0 24 12Z"/>
                    </svg>

                    Facebook

                </button>

                <button type="button" class="social__btn">

                    <svg viewBox="0 0 48 48" width="21" height="21">

                        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11c-.5 2.5-1.9 4.6-4.1 6v5h6.7c3.9-3.6 6-8.8 6-14.7Z"/>

                        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.7-5c-1.8 1.2-4.1 1.9-6.8 1.9-5.2 0-9.6-3.5-11.2-8.2H5.9v5.1A20 20 0 0 0 24 44Z"/>

                        <path fill="#FBBC05" d="M12.8 27.9a12 12 0 0 1 0-7.8V15H5.9a20 20 0 0 0 0 17.9l6.9-5Z"/>

                        <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5c1.6-4.7 6-8.1 11.2-8.1Z"/>

                    </svg>

                    Google

                </button>

            </div>

            <!-- Footer -->

            <footer class="form__footer">

                قبلاً حساب ساخته‌اید؟

                <a href="#">وارد شوید</a>

            </footer>

        </section>

    </main>
